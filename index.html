    <style>
      html,

        height: 100%;

        display: block;

      /* Hover area near the right edge */
      .chat-hover-zone {
        position: fixed;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        width: 60px;
        height: 320px;
        z-index: 3999;
        background: transparent;
      }

      /* Slide-out drawer */
      .chat-drawer {
        position: fixed;
        top: 50%;
        right: 0;
        z-index: 4000;
        transition: transform 200ms ease-in-out;
        will-change: transform;
        transform: translateY(-50%) translateX(calc(100% - 26px));
      }

      /* Visible tab */
      .chat-drawer-tab {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 120px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-right: none;
        border-radius: 10px 0 0 10px;
        z-index: 1;
      }

      .chat-drawer-tab::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 9px;
        transform: translateY(-50%);
        width: 6px;
        height: 44px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.18);
      }

      /* Pop out on hover */
      .chat-hover-zone:hover + .chat-drawer,
      .chat-drawer:hover {
        transform: translateY(-50%) translateX(0);
      }

      /* Content inside drawer */
      .chat-drawer-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        padding-left: 26px; /* leaves room for tab */

        z-index: 2;
        transform: scale(1.15);
        transform-origin: right center;
      }

      /* Co-browse button */
      .cobrowse-button {
        display: inline-block;
        position: relative;
        z-index: 2;
      }

      .cobrowse-button img {
        display: block;
        max-width: 180px;
        height: auto;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .chat-hover-zone {
          width: 40px;
          height: 280px;
        }

        .chat-drawer-tab {
          height: 100px;
        }

        .cobrowse-button img {
          max-width: 140px;
        }
      }
    </style>
