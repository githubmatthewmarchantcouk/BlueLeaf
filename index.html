<!DOCTYPE html>
<html lang="en">
<head>

  <title>Blueleaf 8x8 Demonstration</title>
  <style>

      height: 100vh;

      top: 50%;
      right: 0;
      width: 36px;
      height: 160px;
      transform: translateY(-50%);
      z-index: 9998;

    #chat-widget-shell {

      top: 50%;
      right: 0;
      width: 100px;
      height: 100px;
      transform: translateY(-50%) translateX(55%);
      transform-origin: right center;
      transition: transform 0.25s ease;
      z-index: 9999;
      overflow: visible;
      pointer-events: auto;
    }

    #chat-hover-zone:hover + #chat-widget-shell,
    #chat-widget-shell:hover {
      transform: translateY(-50%) translateX(0);
    }

    #__8x8-chat-button-container-script_27480031269c54d302b1785\.03659003 {

</head>
<body>
  <img src="Blueleafimage1.png" alt="Blueleaf image" />

  <div id="chat-hover-zone" aria-hidden="true"></div>

  <div id="chat-widget-shell">

  <script type="text/javascript">

          channelUuid: "uLgRjuMhRiSI4GLy_-bskQ",

      var params = { domain: config.domain, tenant: config.tenant, channelUuid: config.channelUuid };

          container.style.height = "100px";
          container.style.overflow = "visible";

          var iframe = container.querySelector("iframe");
          if (iframe) {
              iframe.style.width = "100px";
              iframe.style.height = "100px";
              iframe.style.maxWidth = "100px";
              iframe.style.maxHeight = "100px";
              iframe.style.border = "0";
