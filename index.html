  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    .image-wrap {
      width: 100vw;
      height: 100vh;
    }

    .full-screen-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Hover trigger */
    .chat-hover-zone {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 60px;
      height: 760px;
      z-index: 3999;
    }

    /* Drawer */
    .chat-drawer {
      position: fixed;
      top: 50%;
      right: 0;
      z-index: 4000;
      transition: transform 0.2s ease;
      transform: translateY(-50%) translateX(calc(100% - 26px));
    }

    .chat-hover-zone:hover + .chat-drawer,
    .chat-drawer:hover {
      transform: translateY(-50%) translateX(0);
    }

    /* Tab */
    .chat-drawer-tab {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 120px;
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(0,0,0,0.12);
      border-right: none;
      border-radius: 10px 0 0 10px;
    }

    /* Drawer content */
    .chat-drawer-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      padding-left: 26px;
    }

    /* Chat iframe FIXED */
    .chat-frame {
      width: 420px;
      height: 720px;
      border: none;
      background: transparent;
    }

    /* Co-browse button */
    .cobrowse-button img {
      max-width: 180px;
      cursor: pointer;
      display: block;
    }

    @media (max-width: 768px) {
      .chat-frame {
        width: 320px;
        height: 600px;
      }

      .cobrowse-button img {
        max-width: 140px;
      }
    }
  </style>
</head>

<body>

  <div class="chat-hover-zone"></div>

    <div class="chat-drawer-tab"></div>

      <iframe
